name: Feature request
description: 提议一个与插件目标相关的新能力或改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请先说明用户问题和使用场景，不要在公开 Issue 中提交凭据、私有接口文档或真实用户数据。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 谁在什么场景下遇到什么限制？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的命令、配置、输出或交互行为。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 说明已考虑的替代方案、取舍或暂时解决方法。
    validations:
      required: false
  - type: input
    id: platform
    attributes:
      label: 受影响的平台
      description: 例如 platform-neutral、OneBot、QQ Official。
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: 兼容性与安全影响
      description: 是否涉及配置变更、迁移、权限、费用、隐私或上游 API 行为？
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，并确认这不是重复提议。
          required: true
        - label: 我已移除凭据、用户数据、真实媒体 URL 和私有服务信息。
          required: true

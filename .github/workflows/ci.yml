name: CI

"on":
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  quality:
    name: Test and lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Validate repository version sources
        shell: bash
        run: |
          set -euo pipefail
          tag="$(python -c 'import yaml; print(yaml.safe_load(open("metadata.yaml", encoding="utf-8"))["version"])')"
          python scripts/check_repository.py --tag "$tag" --json release-check.json

      - name: Run checks
        run: |
          python -m json.tool _conf_schema.json > /dev/null
          python -m compileall main.py core tests scripts
          python -m pytest -q
          ruff check .
          ruff format --check .
          git diff --check

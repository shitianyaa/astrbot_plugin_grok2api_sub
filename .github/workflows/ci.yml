name: CI

"on":
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip downloads
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-pip-

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Validate pull request release-note declaration
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: python scripts/check_pr.py --event "$GITHUB_EVENT_PATH"

      - name: Validate repository version sources
        shell: bash
        run: |
          set -euo pipefail
          tag="$(python -c 'import yaml; print(yaml.safe_load(open("metadata.yaml", encoding="utf-8"))["version"])')"
          python scripts/check_repository.py --tag "$tag" --json release-check.json

      - name: Validate configuration schema
        run: python -m json.tool _conf_schema.json > /dev/null

      - name: Compile Python sources
        run: python -m compileall main.py core tests scripts

      - name: Run tests
        run: python -m pytest -q

      - name: Run Ruff lint
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Check patch whitespace
        run: git diff --check

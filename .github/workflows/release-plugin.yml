name: Release plugin archive

"on":
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable vX.Y.Z tag
        required: true
        type: string
      dry_run:
        description: Validate and build without publishing
        required: false
        default: true
        type: boolean

permissions: {}

env:
  PLUGIN_NAME: astrbot_plugin_grok2api_sub

jobs:
  release:
    name: Validate and publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out immutable tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Validate, build, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "invalid stable tag: $tag" >&2; exit 1; }
          tag_sha="$(git rev-list -n 1 "$tag")"
          default_sha="$(git rev-parse "origin/$DEFAULT_BRANCH")"
          git merge-base --is-ancestor "$tag_sha" "$default_sha"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "a GitHub Release already exists for $tag" >&2
            exit 1
          fi

          metadata_tag="$(python -c 'import yaml; print(yaml.safe_load(open("metadata.yaml", encoding="utf-8"))["version"])')"
          [[ "$metadata_tag" == "$tag" ]] || { echo "metadata version $metadata_tag does not match $tag" >&2; exit 1; }
          python scripts/check_repository.py --tag "$tag" --json release-check.json
          python -m json.tool _conf_schema.json > /dev/null
          python -m compileall main.py core tests scripts
          python -m pytest -q
          ruff check .
          ruff format --check .
          python scripts/package_plugin.py --tag "$tag" --output-dir dist

          archive="dist/${PLUGIN_NAME}-${tag}.zip"
          checksum="$archive.sha256"
          manifest=dist/manifest.json
          test -f "$archive" && test -f "$checksum" && test -f "$manifest"
          grep -F "$(sha256sum "$archive" | awk '{print $1}')" "$checksum"
          python -c 'import json; json.load(open("dist/manifest.json", encoding="utf-8"))'

          if [[ "${GITHUB_EVENT_NAME}" == "push" || "${INPUT_DRY_RUN:-false}" != "true" ]]; then
            gh release create "$tag" "$archive" "$checksum" "$manifest" --verify-tag --generate-notes --title "$tag"
          else
            echo "dry run: validation and build succeeded; release was not published"
          fi

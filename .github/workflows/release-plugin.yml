name: Release plugin archive

"on":
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable vX.Y.Z tag (optional if running on main)
        required: false
        type: string
      dry_run:
        description: Build without publishing
        required: false
        default: false
        type: boolean

permissions: {}

env:
  PLUGIN_NAME: astrbot_plugin_grok2api_sub

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pyyaml

      - name: Detect version and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          metadata_tag="$(python -c 'import yaml; print(yaml.safe_load(open("metadata.yaml", encoding="utf-8"))["version"])')"
          tag="${INPUT_TAG:-}"
          if [[ -z "$tag" ]]; then
            if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_TYPE:-}" == "branch" ]]; then
              tag="$metadata_tag"
            else
              tag="${GITHUB_REF_NAME}"
            fi
          fi

          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "invalid stable tag: $tag" >&2; exit 1; }

          # Check if this release already exists
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_TYPE:-}" == "branch" ]]; then
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag already exists on GitHub; skipping release for routine commit on main."
              exit 0
            fi
          else
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "a GitHub Release already exists for $tag" >&2
              exit 1
            fi
            tag_sha="$(git rev-list -n 1 "$tag" 2>/dev/null || echo "")"
            default_sha="$(git rev-parse "origin/$DEFAULT_BRANCH" 2>/dev/null || git rev-parse HEAD)"
            if [[ -n "$tag_sha" ]]; then
              git merge-base --is-ancestor "$tag_sha" "$default_sha"
            fi
          fi

          [[ "$metadata_tag" == "$tag" ]] || { echo "metadata version $metadata_tag does not match $tag" >&2; exit 1; }

          # Package plugin archive and extract release notes from CHANGELOG
          python scripts/package_plugin.py --tag "$tag" --output-dir dist
          archive="dist/${PLUGIN_NAME}-${tag}.zip"
          checksum="$archive.sha256"
          notes="dist/release-notes.md"

          python scripts/extract_changelog.py --tag "$tag" --changelog CHANGELOG.md --output "$notes"

          test -f "$archive" && test -f "$checksum" && test -f "$notes"
          grep -F "$(sha256sum "$archive" | awk '{print $1}')" "$checksum"

          # Publish release
          if [[ "${GITHUB_EVENT_NAME}" == "push" || "${INPUT_DRY_RUN:-false}" != "true" ]]; then
            echo "Creating release $tag..."
            gh release create "$tag" "$archive" "$checksum" \
              --target "${GITHUB_SHA}" \
              --title "$tag" \
              --notes-file "$notes" \
              --generate-notes
          else
            echo "dry run: build succeeded; release was not published"
          fi

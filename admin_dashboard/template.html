<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grok2API 状态看板</title>
<style>
  :root { --bg:#f3f4f6; --card:#fff; --line:#e5e7eb; --ink:#111827; --muted:#6b7280;
          --accent:#2563eb; --good:#16a34a; --bad:#dc2626; --warn:#d97706; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); padding:20px;
         font:14px/1.5 -apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif; }
  .wrap { max-width:1100px; margin:0 auto; }
  header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  h1 { font-size:20px; }
  h2 { font-size:13px; color:var(--muted); letter-spacing:.5px; margin-bottom:10px; }
  section { margin-bottom:24px; }
  .row { display:flex; align-items:center; gap:8px; }
  .right { margin-left:auto; }
  .meta { color:var(--muted); font-size:12px; }
  .btn { border:1px solid var(--line); background:var(--card); color:var(--ink);
         padding:6px 14px; border-radius:8px; cursor:pointer; font-size:13px; }
  .btn:hover { border-color:#c7d2fe; }
  .btn.act { background:var(--accent); border-color:var(--accent); color:#fff; }
  .grid4 { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .card .label { font-size:12px; color:var(--muted); }
  .card .big { font-size:26px; font-weight:700; margin:4px 0; }
  .card .unit { font-size:14px; font-weight:400; color:var(--muted); }
  .card .sub { font-size:12px; color:var(--muted); }
  .good { color:var(--good); } .bad { color:var(--bad); } .warn { color:var(--warn); }
  .heal { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; font-size:12px; }
  .chip { background:#eef2ff; color:#3730a3; border-radius:999px; padding:2px 10px; }
  .chip.bad { background:#fee2e2; color:#991b1b; }
  .chip.warn { background:#fef3c7; color:#92400e; }
  .chip.zero { background:#f3f4f6; color:#9ca3af; }
  table { width:100%; border-collapse:collapse; background:var(--card);
          border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  th,td { text-align:right; padding:9px 12px; border-bottom:1px solid var(--line);
          font-variant-numeric:tabular-nums; }
  th { background:#f9fafb; color:var(--muted); font-weight:600; font-size:12px; }
  td:first-child, th:first-child { text-align:left; }
  tr:last-child td { border-bottom:none; }
  @media (max-width:860px) { .grid4,.grid2 { grid-template-columns:1fr 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Grok2API 状态看板</h1>
    <span class="meta">仅 bot 主人可见 · 只读</span>
    <div class="row right">
      <span class="meta">生成于 <b id="gen"></b></span>
      <button class="btn" onclick="location.reload()">刷新</button>
    </div>
  </header>

  <section>
    <h2>账号</h2>
    <div class="grid4" id="accountCards"></div>
    <div class="card" id="accountIssues" style="margin-top:12px"></div>
  </section>

  <section>
    <h2>媒体库</h2>
    <div class="grid2">
      <div class="card" id="imageCard"></div>
      <div class="card" id="videoCard"></div>
    </div>
  </section>

  <section>
    <div class="row" style="margin-bottom:10px">
      <h2 style="margin:0">调用状况 · 请求审计</h2>
      <div class="row right" id="periodRow"></div>
    </div>
    <div class="grid4" id="callCards"></div>
  </section>

  <section>
    <h2>按模型统计 <span class="meta" id="modelNote"></span></h2>
    <table>
      <thead><tr>
        <th>模型</th><th>调用次数</th><th>成功</th><th>失败</th>
        <th>成功率</th><th>平均耗时</th><th>总 Tokens</th>
      </tr></thead>
      <tbody id="modelBody"></tbody>
    </table>
    <p class="meta" style="margin-top:8px" id="modelFoot"></p>
  </section>
</div>

<script>window.__DATA__ = __PAYLOAD__;</script>
<script>
__RENDER_JS__
</script>
</body>
</html>

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astrbot_plugin_grok2api_sub"
version = "0.1.5"
description = "Grok2API Sub 助手：联网搜索、生图、改图、生视频，双平台发送"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "shitianyaa" }]
dependencies = [
    "aiohttp>=3.9.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "AstrBot>=4.26.0,<5",
    "Jinja2>=3.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "PyYAML>=6.0.0",
    "ruff==0.15.22",
    "tomli>=2.0.1; python_version < '3.11'",
]

[tool.setuptools]
packages = ["core"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["testignore"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
